<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Craftsvilla Project" />
    <title>KHÅK Kunsthall</title>
    <!-- Links -->
    <!-- <link rel="shortcut icon" href="images/mars.png" type="image/x-icon" /> -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="order.css" />
    <!-- Links END -->
  </head>
  <body>
    <!-- Header -->
    <header id="home">
      <div class="content">
        <a class="logo" href="#home">KHÅK</a>
        <nav></nav>
      </div>
    </header>

    <!-- Information -->
    <main>
      <section class="section">
        <div class="content">
          <h2>Bestillingsskjema</h2>
          <div class="info" id="info">
            <p>
              Fyll inn dine opplysninger i skjemaet under og så trykk "Fullfør
              bestilling".
            </p>
          </div>
        </div>
      </section>

      <!-- Orderform -->
      <section class="content">
        <form class="orderform" action="">
          <!-- Personal info -->
          <label for="">Fornavn:</label>
          <input type="text" placeholder="..." />
          <label for="">Etternavn:</label>
          <input type="text" placeholder="..." />
          <label for="">Adresse:</label>
          <input type="text" placeholder="..." />
          <label for="">Telefonnummer:</label>
          <input type="tel" placeholder="..." />
          <label for="">Epost-adresse:</label>
          <input type="email" placeholder="..." /> <br />
          <br />
          <!-- Workshop info -->
          <label for="">Workshop:</label>
          <select name="workshop" id="workshop">
            <option value="">Mosaikkunst</option>
            <option value="">Akvarellmaling</option>
            <option value="">Lerretsmaling</option>
          </select>
          <br />
          <br />
          <label for="">Antall deltakere:</label>
          <input
            type="number"
            name="participants"
            id="participants"
            placeholder="..."
          />
          <br />
          <br />
          <label for="">Ønsket dato:</label>
          <input type="date" name="date" id="date" />
          <br />
          <br />
          <label for="">Kommentar:</label>
          <textarea name="comment" id="comment" cols="30" rows="10"></textarea>
        </form>
      </section>

      <!-- Buttons -->
      <section class="content">
        <div class="orderbuttons">
          <a class="button" id="back" href="index.html">Tilbake</a>
          <!-- <a class="button" href="#workshop">Fullfør bestilling</a> -->
          <input id="orderfinish" type="submit" value="Fullfør bestilling" />
        </div>
      </section>
    </main>
  </body>
</html>
